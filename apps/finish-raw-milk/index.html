    <script>
      const button=document.getElementById("complete-button"),finish=document.querySelector(".finish"),toast=document.getElementById("toast"),canvas=document.getElementById("confetti"),ctx=canvas.getContext("2d"),applause=document.getElementById("applause-audio"),dollyAudio=document.getElementById("dolly-audio"),reducedMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;let pieces=[],frame=0,mooTimer=null,finishTimer=null;
      function callDolly(action="celebrate"){if(window.Ruby3D){window.Ruby3D.setAction(action,1900);return true}return false}
      function playCelebrationAudio(){
        clearTimeout(mooTimer);
        [applause,dollyAudio].forEach(audio=>{audio.pause();audio.currentTime=0});
        applause.volume=.9;
        dollyAudio.volume=.95;
        applause.play().catch(()=>{});
        mooTimer=setTimeout(()=>{dollyAudio.currentTime=0;dollyAudio.play().catch(()=>{})},650);
      }
      function celebrationDuration(){
        const applauseMs=Number.isFinite(applause.duration)?applause.duration*1000:5042;
        const dollyMs=650+(Number.isFinite(dollyAudio.duration)?dollyAudio.duration*1000:3768);
        return Math.ceil(Math.max(applauseMs,dollyMs));
      }
      function finishCelebration(){
        pieces=[];
        frame=251;
        ctx.clearRect(0,0,innerWidth,innerHeight);
        toast.classList.remove("show");
        finish.classList.remove("celebrating");
        window.parent?.postMessage({type:"redmond-course-complete",course:"raw-milk-101"},"*");
      }
      function resize(){const ratio=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*ratio;canvas.height=innerHeight*ratio;canvas.style.width=`${innerWidth}px`;canvas.style.height=`${innerHeight}px`;ctx.setTransform(ratio,0,0,ratio,0,0)}function celebrate(count=75){if(reducedMotion)return;resize();const colors=["#a8bd63","#d49a3f","#a95738","#f7e9bc","#31543a"];pieces=Array.from({length:count},()=>({x:innerWidth*.2+Math.random()*innerWidth*.65,y:-20-Math.random()*160,vx:(Math.random()-.5)*2.5,vy:2+Math.random()*4,w:5+Math.random()*8,h:8+Math.random()*10,r:Math.random()*6,vr:(Math.random()-.5)*.18,c:colors[Math.floor(Math.random()*colors.length)]}));frame=0;requestAnimationFrame(draw)}function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);pieces.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.vy+=.012;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()});if(frame++<250)requestAnimationFrame(draw);else ctx.clearRect(0,0,innerWidth,innerHeight)}
      button.addEventListener("click",()=>{if(finish.classList.contains("celebrating"))return;finish.classList.add("celebrating");toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),2200);setTimeout(()=>callDolly("arrived"),180);playCelebrationAudio();celebrate(110);clearTimeout(finishTimer);finishTimer=setTimeout(finishCelebration,celebrationDuration())});addEventListener("resize",resize);
