<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redmond University Video</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="video-frame" class="video-frame" data-frame="wavy">
      <svg
        id="frame-wave"
        class="frame-wave"
        aria-hidden="true"
        focusable="false"
        preserveAspectRatio="none"
      >
        <path id="frame-wave-path"></path>
      </svg>
    </main>

    <p id="video-error" class="video-error" role="alert" hidden></p>

    <script src="./videos.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
