<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RF Menu Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --accent: #111111;
        --ink: #111111;
        --muted: #4d4d4d;
        --panel: #ffffff;
        --line: rgba(17, 17, 17, 0.24);
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
        --radius: 10px;
        --gap: 12px;
        --row: 80px;
        --smoothie-height: 448px;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100vh;
      }

      body {
        padding: clamp(14px, 2.4vw, 28px);
        background: transparent;
        color: var(--ink);
        font-family: "Avenir", "Avenir Next", "Helvetica Neue", "Segoe UI", sans-serif;
      }

      .menu-board {
        width: min(1260px, 100%);
        margin: 0 auto;
        background: #ffffff;
      }

      .menu-board-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: clamp(16px, 2vw, 24px) clamp(18px, 3vw, 34px);
        background: #111111;
        border-radius: var(--radius);
        color: #ffffff;
        font-family: "Montserrat", "Avenir Next", "Segoe UI", sans-serif;
      }

      .menu-board-eyebrow,
      .menu-board-title,
      .menu-board-note {
        margin: 0;
      }

      .menu-board-eyebrow {
        font-size: clamp(0.66rem, 0.8vw, 0.78rem);
        font-weight: 700;
        letter-spacing: 0.16em;
        line-height: 1.2;
        text-transform: uppercase;
      }

      .menu-board-title {
        margin-top: 4px;
        font-size: clamp(1.65rem, 3vw, 2.8rem);
        font-weight: 800;
        line-height: 0.96;
        text-transform: uppercase;
      }

      .menu-board-note {
        max-width: 18ch;
        font-size: clamp(0.82rem, 1vw, 0.95rem);
        font-weight: 700;
        letter-spacing: 0.08em;
        line-height: 1.25;
        text-align: right;
        text-transform: uppercase;
      }

      /* ── Desktop: uniform cards ── */
      .masonry-gallery {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: var(--gap);
        width: 100%;
        padding: clamp(22px, 2.6vw, 36px) 0 0;
      }

      .gallery-item {
        position: relative;
        height: var(--smoothie-height);
        animation: riseIn 0.65s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        animation-delay: var(--delay, 0s);
      }

      /* ── Tablet: 2-column CSS columns ── */
      @media (max-width: 860px) {
        .masonry-gallery {
          display: block;
          columns: 2;
          column-gap: var(--gap);
        }
        .gallery-item {
          break-inside: avoid;
          height: 360px;
          margin-bottom: var(--gap);
        }
      }

      /* ── Mobile: single column ── */
      @media (max-width: 520px) {
        .menu-board-header {
          align-items: flex-start;
          flex-direction: column;
        }

        .menu-board-note {
          max-width: none;
          text-align: left;
        }

        .masonry-gallery { columns: 1; }
        .gallery-item { height: clamp(340px, 115vw, var(--smoothie-height)); }
      }

      /* ── Flip card ── */
      .gallery-card {
        position: relative;
        width: 100%;
        height: 100%;
        perspective: 1200px;
        cursor: pointer;
      }

      .card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        transform-style: preserve-3d;
        transition:
          transform 0.6s cubic-bezier(0.22, 1, 0.36, 1),
          box-shadow 0.22s ease;
      }

      .gallery-card:hover .card-inner,
      .gallery-card:focus-visible .card-inner {
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.24);
        transform: translateY(-3px);
      }

      .gallery-card.is-open .card-inner {
        transform: rotateY(180deg);
      }

      .gallery-card.is-open:hover .card-inner,
      .gallery-card.is-open:focus-visible .card-inner {
        transform: rotateY(180deg) translateY(-2px);
      }

      .gallery-card:focus-visible {
        outline: 3px solid rgba(0, 0, 0, 0.34);
        outline-offset: 5px;
        border-radius: var(--radius);
      }

      /* ── Card faces ── */
      .card-face {
        position: absolute;
        inset: 0;
        border-radius: var(--radius);
        overflow: hidden;
        border: 1px solid var(--line);
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }

      /* Front */
      .card-front { background: #ffffff; }

      .card-front img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        pointer-events: none;
        -webkit-user-drag: none;
        transition: transform 0.5s ease;
      }

      .gallery-card:hover .card-front img { transform: scale(1.05); }
      .gallery-card.is-open .card-front img { transform: scale(1); }

      .card-front::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(10, 18, 22, 0) 35%, rgba(10, 18, 22, 0.74) 100%),
          linear-gradient(90deg, rgba(10, 18, 22, 0.08), rgba(10, 18, 22, 0));
        pointer-events: none;
      }

      .front-label {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 1;
        padding: clamp(10px, 1.4vw, 18px) clamp(12px, 1.8vw, 20px);
        color: #fff;
        font-family: "Montserrat", "Avenir Next", "Segoe UI", sans-serif;
        font-size: clamp(0.78rem, 1.2vw, 1.15rem);
        font-weight: 800;
        line-height: 1.1;
        text-shadow: 0 2px 10px rgba(10, 18, 22, 0.55);
        text-wrap: balance;
      }

      /* Back */
      .card-back {
        transform: rotateY(180deg);
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: clamp(10px, 1.3vw, 16px);
        padding: clamp(18px, 2.2vw, 28px);
        background: var(--panel);
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: rgba(0, 0, 0, 0.28) transparent;
      }

      .card-back::-webkit-scrollbar { width: 5px; }
      .card-back::-webkit-scrollbar-thumb {
        border-radius: 99px;
        background: rgba(0, 0, 0, 0.28);
      }

      .back-eyebrow {
        margin: 0;
        font-size: clamp(0.72rem, 0.85vw, 0.84rem);
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .back-title {
        margin: 0;
        color: var(--accent);
        font-family: "Montserrat", "Avenir Next", "Segoe UI", sans-serif;
        font-size: clamp(1.3rem, 1.8vw, 1.85rem);
        font-weight: 800;
        line-height: 1.08;
        text-wrap: balance;
      }

      .back-divider {
        margin: 2px 0;
        border: none;
        border-top: 1px solid var(--line);
        flex-shrink: 0;
      }

      .back-copy {
        margin: 0;
        color: var(--ink);
        font-size: clamp(1rem, 1.22vw, 1.18rem);
        line-height: 1.45;
        text-wrap: pretty;
      }

      @keyframes riseIn {
        from { opacity: 0; transform: translateY(14px) scale(0.98); }
        to   { opacity: 1; transform: translateY(0)   scale(1);    }
      }

      @media (prefers-reduced-motion: reduce) {
        .gallery-item       { animation: none; }
        .card-inner,
        .card-front img     { transition: none; }
      }
    </style>
  </head>
  <body>
    <section class="menu-board" aria-label="Redmond Farms menu board">
      <header class="menu-board-header">
        <div>
          <p class="menu-board-eyebrow">Redmond Farms</p>
          <h1 class="menu-board-title">Menu</h1>
        </div>
        <p class="menu-board-note">Kitchen Favorites</p>
      </header>

      <main id="gallery" class="masonry-gallery" aria-label="Redmond Farms menu gallery"></main>
    </section>

    <script id="rf-menu-gallery-data" type="application/json">
      [

          "alt": "Farm salad with greens, egg, bacon, and vegetables",
          "copy": "Salads and bowls made with locally-sourced, seasonal produce. Most popular: Quinoa Bowl, Farm Salad, and Veg and Greens."
        },
        {

          "size": "short",
          "image": "../../assets/imgs/rf-register-menu/seasoned-fries.webp",
          "alt": "Seasoned fries served with sauce",
          "copy": "Cooked in coconut oil and seasoned Redmond-style. Classic, Seasoned, or Garlic Herb — a customer favorite every time."
        },
        {
          "title": "Sides",
          "size": "medium",
          "image": "../../assets/imgs/rf-register-menu/avocado-toast.webp",
          "alt": "Avocado toast on sourdough",
          "copy": "Avocado toast, a side of soup or salad, plus add-ons like extra protein, pickled onion, and toast with butter. Perfect for rounding out any meal."
        },
        {
          "title": "House Made Bone Broth",
          "size": "short",
          "image": "../../assets/imgs/rf-register-menu/chicken-broth.webp",
          "alt": "Cup of free-range chicken bone broth",
          "copy": "Chicken or beef broth, both available with added butter and Redmond seasonings for a rich, deeply nourishing cup."
        },
        {
          "title": "Smoothies",
          "size": "hero",
          "image": "../../assets/imgs/rf-register-menu/strawberry-flax.webp",
          "alt": "Strawberry flax smoothie",
          "copy": "A popular option in summer, our smoothies offer a clean way to get extra protein or a cold, refreshing boost. Try the Strawberry Flax or Tropical Ginger!"

        {

    <script>
      (function () {
        var data = JSON.parse(
          document.getElementById("rf-menu-gallery-data").textContent || "[]"
        );
        var gallery = document.getElementById("gallery");

        data.forEach(function (item, index) {
          var wrapper = document.createElement("div");
          wrapper.className = "gallery-item";
          wrapper.dataset.size = item.size || "medium";
          wrapper.style.setProperty("--delay", index * 0.05 + "s");

          /* Flip card */
          var card = document.createElement("div");
          card.className = "gallery-card";
          card.tabIndex = 0;
          card.setAttribute("role", "button");
          card.setAttribute("aria-pressed", "false");
          card.setAttribute("aria-label", item.title + ". Click to read more.");

          var inner = document.createElement("div");
          inner.className = "card-inner";

          /* Front */
          var front = document.createElement("div");
          front.className = "card-face card-front";

          var img = document.createElement("img");
          img.src = item.image;
          img.alt = item.alt || "";
          img.loading = "lazy";
          img.decoding = "async";

          var label = document.createElement("span");
          label.className = "front-label";
          label.textContent = item.title;

          front.append(img, label);

          /* Back */
          var back = document.createElement("div");
          back.className = "card-face card-back";

          var eyebrow = document.createElement("p");
          eyebrow.className = "back-eyebrow";
          eyebrow.textContent = "Redmond Farms Menu";

          var title = document.createElement("p");
          title.className = "back-title";
          title.textContent = item.title;

          var hr = document.createElement("hr");
          hr.className = "back-divider";

          var copy = document.createElement("p");
          copy.className = "back-copy";
          copy.textContent = item.copy;

          back.append(eyebrow, title, hr, copy);
          inner.append(front, back);
          card.appendChild(inner);
          wrapper.appendChild(card);
          gallery.appendChild(wrapper);

          function toggle() {
            var open = card.classList.toggle("is-open");
            card.setAttribute("aria-pressed", String(open));
          }

          card.addEventListener("click", toggle);
          card.addEventListener("keydown", function (e) {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              toggle();
            }
          });
        });
      })();
    </script>
  </body>
</html>
