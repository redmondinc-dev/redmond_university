<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RF Menu Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --accent: #2e3d2c;
        --ink: #263541;
        --muted: #596a75;
        --panel: #f7faf8;
        --line: rgba(38, 53, 65, 0.13);
        --shadow: 0 8px 24px rgba(27, 42, 48, 0.18);
        --radius: 10px;
        --gap: 12px;
        --row: 80px;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100vh;
      }

      body {
        padding: clamp(14px, 2.4vw, 28px);
        background: transparent;
        color: var(--ink);
        font-family: "Avenir", "Avenir Next", "Helvetica Neue", "Segoe UI", sans-serif;
      }

      /* ── Desktop: explicit masonry grid ── */
      .masonry-gallery {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-auto-rows: var(--row);
        gap: var(--gap);
        width: min(1200px, 100%);
        margin: 0 auto;
      }

      .gallery-item {
        position: relative;
        animation: riseIn 0.65s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        animation-delay: var(--delay, 0s);
        /* grid-column and grid-row set inline by JS */
      }

      /* ── Tablet: 2-column CSS columns ── */
      @media (max-width: 860px) {
        .masonry-gallery {
          display: block;
          columns: 2;
          column-gap: var(--gap);
        }
        .gallery-item {
          break-inside: avoid;
          margin-bottom: var(--gap);
        }
        .gallery-item[data-size="tall"]   { height: 300px; }
        .gallery-item[data-size="medium"] { height: 230px; }
        .gallery-item[data-size="short"]  { height: 170px; }
      }

      /* ── Mobile: single column ── */
      @media (max-width: 520px) {
        .masonry-gallery { columns: 1; }
        .gallery-item[data-size="tall"],
        .gallery-item[data-size="medium"],
        .gallery-item[data-size="short"] { height: 260px; }
      }

      /* ── Flip card ── */
      .gallery-card {
        position: relative;
        width: 100%;
        height: 100%;
        perspective: 1200px;
        cursor: pointer;
      }

      .card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        transform-style: preserve-3d;
        transition:
          transform 0.6s cubic-bezier(0.22, 1, 0.36, 1),
          box-shadow 0.22s ease;
      }

      .gallery-card:hover .card-inner,
      .gallery-card:focus-visible .card-inner {
        box-shadow: 0 18px 42px rgba(27, 42, 48, 0.26);
        transform: translateY(-3px);
      }

      .gallery-card.is-open .card-inner {
        transform: rotateY(180deg);
      }

      .gallery-card.is-open:hover .card-inner,
      .gallery-card.is-open:focus-visible .card-inner {
        transform: rotateY(180deg) translateY(-2px);
      }

      .gallery-card:focus-visible {
        outline: 3px solid rgba(46, 61, 44, 0.36);
        outline-offset: 5px;
        border-radius: var(--radius);
      }

      /* ── Card faces ── */
      .card-face {
        position: absolute;
        inset: 0;
        border-radius: var(--radius);
        overflow: hidden;
        border: 1px solid var(--line);
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }

      /* Front */
      .card-front { background: #cdd8cc; }

      .card-front img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        pointer-events: none;
        -webkit-user-drag: none;
        transition: transform 0.5s ease;
      }

      .gallery-card:hover .card-front img { transform: scale(1.05); }
      .gallery-card.is-open .card-front img { transform: scale(1); }

      .card-front::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(10, 18, 22, 0) 35%, rgba(10, 18, 22, 0.74) 100%),
          linear-gradient(90deg, rgba(10, 18, 22, 0.08), rgba(10, 18, 22, 0));
        pointer-events: none;
      }

      .front-label {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 1;
        padding: clamp(10px, 1.4vw, 18px) clamp(12px, 1.8vw, 20px);
        color: #fff;
        font-family: "Montserrat", "Avenir Next", "Segoe UI", sans-serif;
        font-size: clamp(0.78rem, 1.2vw, 1.15rem);
        font-weight: 800;
        line-height: 1.1;
        text-shadow: 0 2px 10px rgba(10, 18, 22, 0.55);
        text-wrap: balance;
      }

      /* Back */
      .card-back {
        transform: rotateY(180deg);
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: clamp(12px, 1.8vw, 20px);
        background:
          linear-gradient(135deg, rgba(255,255,255,0.96), rgba(247,250,248,0.96)),
          var(--panel);
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: rgba(38,53,65,0.22) transparent;
      }

      .card-back::-webkit-scrollbar { width: 5px; }
      .card-back::-webkit-scrollbar-thumb {
        border-radius: 99px;
        background: rgba(38,53,65,0.2);
      }

      .back-eyebrow {
        margin: 0;
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .back-title {
        margin: 0;
        color: var(--accent);
        font-family: "Montserrat", "Avenir Next", "Segoe UI", sans-serif;
        font-size: clamp(0.82rem, 1.2vw, 1.05rem);
        font-weight: 800;
        line-height: 1.14;
      }

      .back-divider {
        margin: 2px 0;
        border: none;
        border-top: 1px solid var(--line);
        flex-shrink: 0;
      }

      .back-copy {
        margin: 0;
        color: var(--ink);
        font-size: clamp(0.72rem, 0.9vw, 0.86rem);
        line-height: 1.52;
        flex: 1;
      }

      @keyframes riseIn {
        from { opacity: 0; transform: translateY(14px) scale(0.98); }
        to   { opacity: 1; transform: translateY(0)   scale(1);    }
      }

      @media (prefers-reduced-motion: reduce) {
        .gallery-item       { animation: none; }
        .card-inner,
        .card-front img     { transition: none; }
      }
    </style>
  </head>
  <body>
    <main id="gallery" class="masonry-gallery" aria-label="Redmond Farms menu gallery"></main>

      [

    <script>
      (function () {
        /*
         * Desktop masonry: explicit CSS Grid placement.
         * Each item is assigned a column and row span so the layout looks
         * like a hand-crafted photo mosaic.
         *
         * 3 columns, grid-auto-rows: 80px, gap: 12px
         *
         *  Col 1            Col 2           Col 3
         *  Breakfast  r1-4  Sandwiches r1-3  Burgers   r1-4
         *  Sides      r5-7  From Garden r4-6 Fries     r5-6
         *  BlendMilks r8-10 BoneBroth  r7-8  Smoothies r7-11
         *  Tea        r11-13 Coffee    r9-13
         */
        var placements = [
          { col: 1, rowStart: 1,  rowSpan: 4 }, // Breakfast
          { col: 2, rowStart: 1,  rowSpan: 3 }, // Sandwiches
          { col: 3, rowStart: 1,  rowSpan: 4 }, // Burgers
          { col: 2, rowStart: 4,  rowSpan: 3 }, // From Garden
          { col: 3, rowStart: 5,  rowSpan: 2 }, // Fries
          { col: 1, rowStart: 5,  rowSpan: 3 }, // Sides
          { col: 2, rowStart: 7,  rowSpan: 2 }, // Bone Broth
          { col: 3, rowStart: 7,  rowSpan: 5 }, // Smoothies
          { col: 1, rowStart: 8,  rowSpan: 3 }, // Blended Milks
          { col: 2, rowStart: 9,  rowSpan: 5 }, // Coffee
          { col: 1, rowStart: 11, rowSpan: 3 }  // Tea
        ];

        var data = JSON.parse(
          document.getElementById("rf-menu-gallery-data").textContent || "[]"
        );
        var gallery = document.getElementById("gallery");

        data.forEach(function (item, index) {
          var p = placements[index];

          /* Wrapper — grid item */
          var wrapper = document.createElement("div");
          wrapper.className = "gallery-item";
          wrapper.dataset.size = item.size || "medium";
          wrapper.style.setProperty("--delay", index * 0.05 + "s");
          /* Desktop explicit placement */
          wrapper.style.gridColumn = String(p.col);
          wrapper.style.gridRow = p.rowStart + " / span " + p.rowSpan;

          /* Flip card */
          var card = document.createElement("div");
          card.className = "gallery-card";
          card.tabIndex = 0;
          card.setAttribute("role", "button");
          card.setAttribute("aria-pressed", "false");
          card.setAttribute("aria-label", item.title + ". Click to read more.");

          var inner = document.createElement("div");
          inner.className = "card-inner";

          /* Front */
          var front = document.createElement("div");
          front.className = "card-face card-front";

          var img = document.createElement("img");
          img.src = item.image;
          img.alt = item.alt || "";
          img.loading = "lazy";
          img.decoding = "async";

          var label = document.createElement("span");
          label.className = "front-label";
          label.textContent = item.title;

          front.append(img, label);

          /* Back */
          var back = document.createElement("div");
          back.className = "card-face card-back";

          var eyebrow = document.createElement("p");
          eyebrow.className = "back-eyebrow";
          eyebrow.textContent = "Redmond Farms Menu";

          var title = document.createElement("p");
          title.className = "back-title";
          title.textContent = item.title;

          var hr = document.createElement("hr");
          hr.className = "back-divider";

          var copy = document.createElement("p");
          copy.className = "back-copy";
          copy.textContent = item.copy;

          back.append(eyebrow, title, hr, copy);
          inner.append(front, back);
          card.appendChild(inner);
          wrapper.appendChild(card);
          gallery.appendChild(wrapper);

          function toggle() {
            var open = card.classList.toggle("is-open");
            card.setAttribute("aria-pressed", String(open));
          }

          card.addEventListener("click", toggle);
          card.addEventListener("keydown", function (e) {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              toggle();
            }
          });
        });
      })();
    </script>
  </body>
</html>
