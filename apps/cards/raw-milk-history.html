<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Why Can't I Find Raw Milk?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --navy: #18384a;
        --ink: #34434c;
        --muted: #71808a;
        --gold: #dfa02d;
        --gold-soft: #fff4dc;
        --cream: #fffdf8;
        --line: #dfe6e8;
        --paper: #fff;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        min-height: 100vh;
        padding: clamp(18px, 4vw, 48px);
        color: var(--ink);
        background:
          radial-gradient(circle at 0 0, rgba(223,160,45,.13), transparent 30%),
          linear-gradient(145deg, var(--cream), #f7faf9);
        font-family: "Avenir Next", Avenir, "Trebuchet MS", sans-serif;
      }

      button, a { font: inherit; }

      .experience {
        width: min(1180px, 100%);
        margin: 0 auto;
      }

      .header { margin-bottom: clamp(22px, 4vw, 42px); }
      .eyebrow {
        margin: 0 0 8px;
        color: var(--gold);
        font-family: Montserrat, sans-serif;
        font-size: .75rem;
        font-weight: 800;
        letter-spacing: .17em;
        text-transform: uppercase;
      }
      h1 {
        max-width: 980px;
        margin: 0;
        color: var(--gold);
        font-family: Montserrat, sans-serif;
        font-size: clamp(1.7rem, 4vw, 3.15rem);
        line-height: 1.08;
        text-wrap: balance;
      }

      .timeline {
        display: grid;
        grid-template-columns: 270px minmax(0, 1fr);
        gap: clamp(24px, 5vw, 64px);
        align-items: stretch;
      }

      .steps {
        position: relative;
        display: grid;
        align-content: center;
        gap: 5px;
      }
      .steps::before {
        content: "";
        position: absolute;
        left: 17px;
        top: 12%;
        bottom: 12%;
        width: 2px;
        background: var(--line);
      }

      .step {
        position: relative;
        display: grid;
        grid-template-columns: 36px 1fr;
        gap: 13px;
        align-items: center;
        min-height: 54px;
        padding: 7px 8px 7px 0;
        border: 0;
        border-radius: 12px;
        color: var(--muted);
        background: transparent;
        text-align: left;
        cursor: pointer;
        transition: color .2s ease, background .2s ease, transform .2s ease;
      }
      .step:hover { color: var(--navy); transform: translateX(3px); }
      .step:focus-visible { outline: 3px solid rgba(223,160,45,.3); outline-offset: 2px; }
      .step__dot {
        position: relative;
        z-index: 1;
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border: 2px solid var(--line);
        border-radius: 50%;
        background: var(--paper);
        font-family: Montserrat, sans-serif;
        font-size: .76rem;
        font-weight: 800;
        transition: all .2s ease;
      }
      .step__label { font-family: Montserrat, sans-serif; font-size: .8rem; font-weight: 700; line-height: 1.2; }
      .step.is-visited .step__dot { border-color: var(--gold); color: var(--gold); }
      .step.is-active { color: var(--navy); background: var(--gold-soft); }
      .step.is-active .step__dot { border-color: var(--gold); color: white; background: var(--gold); box-shadow: 0 0 0 5px rgba(223,160,45,.14); }

      .story-card {
        position: relative;
        min-height: 520px;
        display: grid;
        grid-template-rows: auto 1fr auto;
        overflow: hidden;
        border: 1px solid rgba(24,56,74,.1);
        border-radius: 28px;
        background: rgba(255,255,255,.94);
        box-shadow: 0 28px 70px rgba(24,56,74,.12);
      }

      .visual {
        position: relative;
        min-height: 155px;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: linear-gradient(135deg, #f9e4b4, #fff7e6 55%, #e8f1ee);
      }
      .visual::before, .visual::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        background: rgba(255,255,255,.48);
      }
      .visual::before { width: 180px; height: 180px; left: -45px; top: -75px; }
      .visual::after { width: 120px; height: 120px; right: -22px; bottom: -55px; }
      .visual__icon {
        position: relative;
        z-index: 1;
        font-size: clamp(3.6rem, 8vw, 5.8rem);
        filter: drop-shadow(0 12px 12px rgba(24,56,74,.12));
        animation: arrive .38s ease both;
      }
      .visual__year {
        position: absolute;
        right: 24px;
        top: 18px;
        color: rgba(24,56,74,.18);
        font-family: Montserrat, sans-serif;
        font-size: clamp(1.7rem, 4vw, 3rem);
        font-weight: 800;
      }

      .content { padding: clamp(24px, 4vw, 42px); }
      .counter { margin: 0 0 8px; color: var(--gold); font-family: Montserrat, sans-serif; font-size: .75rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
      h2 { margin: 0 0 18px; color: var(--navy); font-family: Montserrat, sans-serif; font-size: clamp(1.35rem, 3vw, 2.05rem); line-height: 1.08; }
      .copy { animation: arrive .38s ease both; }
      .copy p { margin: 0 0 14px; font-size: clamp(.98rem, 1.7vw, 1.12rem); line-height: 1.62; }
      .copy p:last-child { margin-bottom: 0; }

      .sources { display: grid; gap: 9px; }
      .sources a { color: #44624e; font-size: .86rem; font-weight: 700; overflow-wrap: anywhere; }
      .sources a:hover { color: var(--gold); }

      .controls {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 16px;
        align-items: center;
        padding: 19px clamp(24px, 4vw, 42px) 24px;
        border-top: 1px solid var(--line);
      }
      .nav-button {
        min-width: 112px;
        padding: 12px 18px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--navy);
        background: white;
        font-family: Montserrat, sans-serif;
        font-size: .76rem;
        font-weight: 800;
        cursor: pointer;
      }
      .nav-button--next { border-color: var(--gold); color: white; background: var(--gold); }
      .nav-button:disabled { opacity: .35; cursor: default; }
      .progress { height: 7px; overflow: hidden; border-radius: 999px; background: #edf1f1; }
      .progress span { display: block; width: 14.285%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #edbd57, var(--gold)); transition: width .35s ease; }

      @keyframes arrive { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

      @media (max-width: 760px) {
        body { padding: 20px 14px; }
        .timeline { grid-template-columns: 1fr; gap: 18px; }
        .steps { grid-template-columns: repeat(7, minmax(38px, 1fr)); gap: 5px; overflow-x: auto; padding: 5px; }
        .steps::before { left: 8%; right: 8%; top: 22px; bottom: auto; width: auto; height: 2px; }
        .step { display: grid; grid-template-columns: 1fr; justify-items: center; min-height: auto; padding: 0; background: transparent !important; }
        .step__label { display: none; }
        .story-card { min-height: 570px; }
        .controls { grid-template-columns: 1fr 1fr; }
        .progress { grid-column: 1 / -1; grid-row: 1; }
        .nav-button { min-width: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <main class="experience">
      <header class="header">
        <p class="eyebrow">The story behind the standard</p>
        <h1>So, what happened? Why can't I find raw milk in local grocery stores?</h1>
      </header>

      <div class="timeline">
        <nav class="steps" id="steps" aria-label="Raw milk history timeline"></nav>

        <section class="story-card" aria-live="polite">
          <div class="visual">
            <span class="visual__year" id="year"></span>
            <span class="visual__icon" id="icon" aria-hidden="true"></span>
          </div>
          <div class="content">
            <p class="counter" id="counter"></p>
            <h2 id="title"></h2>
            <div class="copy" id="copy"></div>
          </div>
          <div class="controls">
            <button class="nav-button" id="previous" type="button">← Previous</button>
            <div class="progress" aria-hidden="true"><span id="progress"></span></div>
            <button class="nav-button nav-button--next" id="next" type="button">Next →</button>
          </div>
        </section>
      </div>
    </main>

    <script>
      (() => {
        const moments = [
          {
            label: "Industrial Revolution",
            title: "The dairy industry changed",
            year: "1800s",
            icon: "🏭",
            html: `<p>In the 1800s, the Industrial Revolution began to significantly impact the dairy industry. While the era brought many advancements, the quality and availability of milk suffered. Previously healthy cows were relocated to cities and confined to cramped, dirty quarters near liquor distilleries for convenience. There, they were fed spent grain from alcohol production, which caused them to become severely ill.</p>`
          },
          {
            label: "Swill milk",
            title: "A pale, bluish milk",
            year: "01",
            icon: "🥛",
            html: `<p>The milk that these sick cows produced was a pale, bluish tint and completely unpalatable. This was called “swill milk”, and the quality was so poor that it couldn't be used for making butter or cheese.</p>`
          },
          {
            label: "Country fresh",
            title: "Disguising the problem",
            year: "02",
            icon: "🥚",
            html: `<p>At this time, people were unaware and unconcerned about germs. They thickened the milk with eggs and starch, whitened it with Plaster of Paris, and sweetened it with molasses to make it taste better. This new concoction was marketed and sold as "country fresh."</p>`
          },
          {
            label: "Human cost",
            title: "Consumers couldn't see the source",
            year: "20%",
            icon: "⚠️",
            html: `<p>For the first time in history, people were disconnected from their food sources and the farmers who raised the cows. They had no idea how sick the animals were that produced their milk. As a result, consumers unknowingly drank this milk, believing it was safe, and gave it to their families. This led to a sharp rise in infant mortality, which reached 20% over a four-year period. A study by the New York Academy of Medicine later confirmed that the increase in infant deaths was linked to the contaminated "swill milk."</p>`
          },
          {
            label: "Pasteurization",
            title: "The first response",
            year: "01",
            icon: "♨️",
            html: `<p>Two primary responses emerged from this discovery.</p><p>The first was a process called pasteurization, developed by French scientist Louis Pasteur. He discovered that heating milk to just below boiling for a specific period could kill harmful bacteria. This process made it possible for low-quality milk to be made drinkable and relatively safe for consumption.</p>`
          },
          {
            label: "Certified clean",
            title: "The second response",
            year: "02",
            icon: "✓",
            html: `<p>The second response was the establishment of "certified clean" dairies, which sold raw milk held to unusually high standards of cleanliness for the time. These dairies implemented revolutionary (at the time) practices such as wiping down teats before and after milking, washing hands, and sterilizing equipment. (Remember, germ theory was relatively new at the time.) The goal was to preserve the beneficial bacteria in raw milk while minimizing the risk of harmful contamination.</p>`
          },
          {
            label: "Industry standard",
            title: "How pasteurization became the norm",
            year: "TODAY",
            icon: "🏪",
            html: `<p>Initially, many people were hesitant to embrace pasteurization, aware that the process eliminated not only harmful bacteria but also beneficial microbes. Despite this concern, public support grew, especially with influential figures like Babe Ruth publicly endorsing pasteurized milk. As pasteurization technology improved and became more reliable, pasteurized milk emerged as the new industry standard. Over time, raw milk became increasingly rare—and in many regions, its sale was eventually made illegal, claiming to ensure public safety in this product. <a href="https://www.researchgate.net/publication/248920842_The_Untold_Story_of_Milk_The_History_Politics_and_Science_of_Nature's_Perfect_Food_Raw_Milk_from_Pasture-Fed_Cows_by_Ron_Schmid" target="_blank" rel="noopener">[2]</a></p><div class="sources"><a href="https://www.rawmilkinstitute.org/updates/category/Raw+Milk+History" target="_blank" rel="noopener">[1] https://www.rawmilkinstitute.org/updates/category/Raw+Milk+History</a><a href="https://www.researchgate.net/publication/248920842_The_Untold_Story_of_Milk_The_History_Politics_and_Science_of_Nature's_Perfect_Food_Raw_Milk_from_Pasture-Fed_Cows_by_Ron_Schmid" target="_blank" rel="noopener">[2] https://www.researchgate.net/publication/248920842_The_Untold_Story_of_Milk_The_History_Politics_and_Science_of_Nature's_Perfect_Food_Raw_Milk_from_Pasture-Fed_Cows_by_Ron_Schmid (pg 5)</a></div>`
          }
        ];

        const steps = document.getElementById("steps");
        const title = document.getElementById("title");
        const year = document.getElementById("year");
        const icon = document.getElementById("icon");
        const copy = document.getElementById("copy");
        const counter = document.getElementById("counter");
        const progress = document.getElementById("progress");
        const previous = document.getElementById("previous");
        const next = document.getElementById("next");
        let current = 0;
        let furthest = 0;

        moments.forEach((moment, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "step";
          button.innerHTML = `<span class="step__dot">${index + 1}</span><span class="step__label">${moment.label}</span>`;
          button.addEventListener("click", () => show(index));
          steps.append(button);
        });

        function show(index) {
          current = Math.max(0, Math.min(index, moments.length - 1));
          furthest = Math.max(furthest, current);
          const moment = moments[current];
          counter.textContent = `Moment ${current + 1} of ${moments.length}`;
          title.textContent = moment.title;
          year.textContent = moment.year;
          icon.textContent = moment.icon;
          icon.style.animation = "none";
          copy.style.animation = "none";
          void copy.offsetWidth;
          icon.style.animation = "";
          copy.style.animation = "";
          copy.innerHTML = moment.html;
          progress.style.width = `${((current + 1) / moments.length) * 100}%`;
          previous.disabled = current === 0;
          next.textContent = current === moments.length - 1 ? "Start over ↻" : "Next →";
          [...steps.children].forEach((step, stepIndex) => {
            step.classList.toggle("is-active", stepIndex === current);
            step.classList.toggle("is-visited", stepIndex <= furthest);
            step.setAttribute("aria-current", stepIndex === current ? "step" : "false");
          });
        }

        previous.addEventListener("click", () => show(current - 1));
        next.addEventListener("click", () => show(current === moments.length - 1 ? 0 : current + 1));
        addEventListener("keydown", (event) => {
          if (event.key === "ArrowRight") show(current === moments.length - 1 ? 0 : current + 1);
          if (event.key === "ArrowLeft") show(current - 1);
        });
        show(0);
      })();
    </script>
  </body>
</html>
