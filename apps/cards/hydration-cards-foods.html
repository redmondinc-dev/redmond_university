<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hydration Food Cards</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap");

      :root {
        --card-width: clamp(320px, 30vw, 380px);
        --card-height: 448px;
        --card-radius: 18px;
        --card-gap: 18px;
        --ink: #111111;
        --accent: #111111;
        --border: rgba(17, 17, 17, 0.24);
        --paper: #ffffff;
        --back: #ffffff;
        --shadow: 0 16px 34px rgba(0, 0, 0, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px 20px;
        color: var(--ink);
        background: transparent;
        font-family: "Avenir", "Avenir Next", "Segoe UI", sans-serif;
      }

      .cards-board {
        width: min(1480px, 100%);
        container-type: inline-size;
        background: #ffffff;
      }

      .cards-grid {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, var(--card-width)));
        justify-content: center;
        gap: var(--card-gap);
        padding: clamp(14px, 2vw, 24px);
      }

      .hydration-card {
        width: 100%;
        height: var(--card-height);
        border: 0;
        padding: 0;
        background: transparent;
        border-radius: var(--card-radius);
        cursor: pointer;
        perspective: 1000px;
        filter: drop-shadow(var(--shadow));
      }

      .hydration-card:hover .card-inner,
      .hydration-card:focus-visible .card-inner {
        transform: translateY(-3px);
      }

      .hydration-card.is-flipped .card-inner {
        transform: rotateY(180deg);
      }

      .hydration-card.is-flipped:hover .card-inner,
      .hydration-card.is-flipped:focus-visible .card-inner {
        transform: rotateY(180deg) translateY(-2px);
      }

      .hydration-card:focus-visible {
        outline: 3px solid rgba(0, 0, 0, 0.34);
        outline-offset: 5px;
      }

      .card-inner {
        display: block;
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        transition: transform 0.58s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .card-face {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--border);
        border-radius: var(--card-radius);
        background: var(--paper);
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        overflow: hidden;
      }

      .card-front img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
        -webkit-user-drag: none;
      }

      .card-front::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        box-shadow: inset 0 0 28px 14px #ffffff;
        pointer-events: none;
      }

      .card-back {
        transform: rotateY(180deg);
        flex-direction: column;
        gap: 20px;
        padding: 34px 28px;
        background: var(--back);
        text-align: center;
      }

      .card-title {
        margin: 0;
        color: var(--accent);
        font-family: "Montserrat", "Avenir Next", "Segoe UI", sans-serif;
        font-size: clamp(2rem, 2.3vw, 2.45rem);
        font-weight: 700;
        letter-spacing: 0.08em;
        line-height: 1.04;
        text-transform: uppercase;
        text-wrap: balance;
      }

      .card-copy {
        margin: 0;
        font-size: clamp(1.2rem, 1.45vw, 1.48rem);
        line-height: 1.35;
        text-wrap: pretty;
      }

      @container (min-width: 1382px) {
        .cards-grid {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }

      @media (max-width: 620px) {
        :root {
          --card-width: clamp(155px, 44vw, 200px);
          --card-height: clamp(280px, 78vw, 330px);
          --card-gap: 14px;
        }

        body {
          padding: 20px 12px;
        }

        .card-back {
          padding: 22px 14px;
          gap: 12px;
        }

        .card-title {
          font-size: clamp(1.24rem, 7.2vw, 1.55rem);
        }

        .card-copy {
          font-size: clamp(0.92rem, 4.6vw, 1.05rem);
        }
      }

      @media (max-width: 360px) {
        .cards-grid {
          grid-template-columns: minmax(0, var(--card-width));
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .card-inner {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <section class="cards-board" aria-label="Hydration food board">
      <main id="cards" class="cards-grid" aria-label="Hydration food cards"></main>
    </section>

    <script>
      (function () {
        const cardsData = [
          {
            title: "Potassium",
            image: "../../assets/imgs/hydration-cards/potassium.png",
            alt: "Bananas, oranges, and potatoes",
            copy: "Potassium: bananas, oranges, potatoes",
          },
          {
            title: "Magnesium",
            image: "../../assets/imgs/hydration-cards/magnesium.png",
            alt: "Leafy greens, avocados, and nuts",
            copy: "Magnesium: leafy greens, avocados, nuts",
          },
          {
            title: "Calcium",
            image: "../../assets/imgs/hydration-cards/calcium.png",
            alt: "Dairy, sardines, and sesame seeds",
            copy: "Calcium: dairy, sardines, sesame seeds",
          },
          {
            title: "Na + Cl",
            image: "../../assets/imgs/hydration-cards/sodiumandchloride.png",
            alt: "Mineral-rich salts",
            copy: "Sodium & Chloride: mineral-rich salts like Redmond Real Salt",
          },
        ];

        const cards = cardsData.map((card, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "hydration-card";
          button.setAttribute("aria-pressed", "false");
          button.setAttribute("aria-label", `${card.title}. Click to reveal copy.`);

          const inner = document.createElement("span");
          inner.className = "card-inner";

          const front = document.createElement("span");
          front.className = "card-face card-front";

          const img = document.createElement("img");
          img.src = card.image;
          img.alt = card.alt;
          img.decoding = "async";
          img.loading = index === 0 ? "eager" : "lazy";
          front.appendChild(img);

          const back = document.createElement("span");
          back.className = "card-face card-back";

          const title = document.createElement("span");
          title.className = "card-title";
          title.textContent = card.title;

          const copy = document.createElement("span");
          copy.className = "card-copy";
          copy.textContent = card.copy;

          back.append(title, copy);
          inner.append(front, back);
          button.appendChild(inner);

          button.addEventListener("click", () => {
            const isFlipped = button.classList.toggle("is-flipped");
            button.setAttribute("aria-pressed", String(isFlipped));
          });

          return button;
        });

        document.getElementById("cards").replaceChildren(...cards);
      })();
    </script>
  </body>
</html>
