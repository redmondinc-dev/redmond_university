<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Re-Lyte Memory Match</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="screen-text" id="live-region" aria-live="polite" aria-atomic="true"></div>

    <main class="game-shell">
      <header class="game-header">
        <div class="title-stack">
          <span class="small-label">Product Memory</span>
          <h1>Re-Lyte Memory Match</h1>
          <p class="intro">
            Match each Re-Lyte product with its description.
          </p>
        </div>

        <div class="score-panel" aria-label="Game status">
          <div class="score-chip">
            <span>Attempts</span>
            <strong id="attempt-count">0</strong>
          </div>
          <div class="score-chip">
            <span>Matches</span>
            <strong id="match-count">0 / 8</strong>
          </div>
          <button class="secondary-btn" id="reset-btn" type="button">Restart</button>
        </div>
      </header>

      <section class="game-board-wrap" aria-labelledby="board-title">
        <div class="board-heading">
          <div>
            <span class="small-label">Find the pairs</span>
            <h2 id="board-title">Memory board</h2>
          </div>
          <div class="progress-track" aria-label="Matched pair progress">
            <span id="progress-fill"></span>
          </div>
        </div>

        <div class="reading-prompt" id="reading-prompt" role="status" aria-live="polite" hidden>
          <div class="reading-prompt__copy">
            <strong>Finished reading?</strong>
            <span>The cards will turn back over in <b id="reading-seconds">10</b> seconds.</span>
          </div>
          <button class="primary-btn reading-prompt__button" id="continue-btn" type="button">
            Continue playing
          </button>
          <div class="reading-timer" aria-hidden="true">
            <span id="reading-timer-fill"></span>
          </div>
        </div>

        <div class="memory-grid" id="memory-grid" aria-label="Memory cards"></div>
      </section>
    </main>

    <div
      class="result-overlay"
      id="result-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="result-title"
      hidden
    >
      <section class="result-card">
        <span class="result-kicker" id="result-kicker">Game complete</span>
        <h2 id="result-title">All pairs found</h2>
        <p id="result-copy"></p>
        <div class="result-stats">
          <div>
            <span>Attempts</span>
            <strong id="final-attempts">0</strong>
          </div>
          <div>
            <span>Efficiency</span>
            <strong id="final-rating">0%</strong>
          </div>
        </div>
        <button class="primary-btn" id="play-again-btn" type="button">Play again</button>
      </section>
    </div>

    <div class="confetti-layer" id="confetti-layer" aria-hidden="true"></div>

    <script src="script.js"></script>
  </body>
</html>
